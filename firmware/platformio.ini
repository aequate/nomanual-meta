; NoManual rig firmware (ESP32 DevKit v1 class boards, Arduino framework).
; Build:   pio run            (from this folder)
; Upload:  pio run -t upload  (not done yet: nothing has run on a real board)
; Monitor: pio device monitor
; The machine core (src/engine.cpp, src/controller.cpp, src/guard.cpp) is Arduino-free and is
; also compiled on the host by tests/rig (see firmware/README.md).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.0.6
build_flags =
    -Wall
    -Wextra
    -ffp-contract=off
    -DNM_SOFT_TOP=0.88
build_src_flags =
    -Werror
